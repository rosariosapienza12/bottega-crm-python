{% extends "base.html" %}

{% block title %}Clienti - Bottega{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <h1>Clienti</h1>
      <p>Clicca sul nome di una colonna per ordinare.</p>
    </div>
    <a class="btn" href="/clienti/nuovo">Nuovo cliente</a>
  </div>

  <form action="/clienti" method="get" class="max-w-md" role="search"
        hx-get="/clienti" hx-trigger="input changed delay:250ms from:#q, search from:#q"
        hx-target="#tabella" hx-swap="outerHTML" hx-push-url="true">
    <label for="q" class="sr-only">Cerca</label>
    <input id="q" type="search" name="q" value="{{ q }}" autocomplete="off"
           placeholder="Cerca per nome, cognome o telefono">
    {# Lo aggiorna la tabella quando cambi ordinamento (hx-swap-oob) #}
    <input type="hidden" id="ordina" name="ordina" value="{{ sort }}">
  </form>

  {% include "customers/_table.html" %}
{% endblock %}
