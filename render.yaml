# Configurazione per Render (piano gratuito): la demo online di Bottega.
# Su Render: New > Blueprint > scegli questo repository.
services:
  - type: web
    name: bottega-demo
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /accedi
    envVars:
      # Render genera una chiave casuale: non è scritta da nessuna parte nel codice
      - key: SECRET_KEY
        generateValue: true
      # Sul piano gratuito il disco si azzera a ogni riavvio: va bene per una demo
      - key: DATABASE_URL
        value: sqlite:///bottega.db
      - key: DEMO_MODE
        value: "true"
      # Render serve il sito in HTTPS: il cookie di login viaggia solo cifrato
      - key: SESSION_HTTPS_ONLY
        value: "true"
      # Il container è raggiungibile solo attraverso il proxy di Render
      - key: FORWARDED_ALLOW_IPS
        value: "*"
